name: partsrelay-site

services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:24-trixie
    init: true
    command: sleep infinity
    working_dir: /workspace
    ports:
      - 127.0.0.1:${SITE_PORT:-4321}:4321
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-0}
      SITE_PORT: ${SITE_PORT:-4321}
    volumes:
      - .:/workspace:cached
      - bun-cache:/home/node/.bun/install/cache

volumes:
  bun-cache:
