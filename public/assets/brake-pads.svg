  <g transform="matrix(.94 -.20 0 1.08 123 137)" stroke="#254950" stroke-width="2.5" stroke-linejoin="round">
    <use href="#lining" transform="translate(10 4)" fill="#6e8c83"/>
    <use href="#backing" fill="#c6d8cc"/>
    <path d="M-38-2q11-14 36-20t42-2l4 9Q26-18 7-13T-37 7Z" fill="#e5eddf" stroke-width="1.4"/>
    <circle cx="-47" cy="11" r="3" fill="#728e83" stroke="none"/><circle cx="46" cy="-12" r="3" fill="#728e83" stroke="none"/>
  </g>
  <g transform="matrix(.75 -.20 0 1.03 307 161)" stroke="#254950" stroke-width="2.5" stroke-linejoin="round">
    <circle cx="17" cy="5" r="96" fill="#aac0b5"/>
    <path d="m64-67 14 5m-2 5 14 5m-6 6 14 5m-8 7 14 4m-9 9 14 4m-11 10 14 4m-12 10 14 4m-14 10 14 4m-17 10 13 4m-18 8 12 4m-18 8 11 3m-21 7 10 3m-25 5 10 3" fill="none" stroke="#42605b" stroke-width="3" stroke-linecap="round"/>
    <circle r="96" fill="#eff3e7"/>
    <circle r="79" fill="none" stroke="#b4c7bd" stroke-width="1.3"/>
    <circle r="65" fill="none" stroke="#b4c7bd" stroke-width="1.3"/>
    <use href="#slot"/><use href="#slot" transform="rotate(60)"/><use href="#slot" transform="rotate(120)"/><use href="#slot" transform="rotate(180)"/><use href="#slot" transform="rotate(240)"/><use href="#slot" transform="rotate(300)"/>
    <circle r="49" fill="#adbbb0"/>
    <circle cx="-8" cy="-2" r="44" fill="#ccddd1"/>
    <g transform="translate(-8 -2)" fill="#fcfaf0">
      <circle r="16" stroke-width="3"/>
      <circle cy="-29" r="4.7"/><circle cx="27.6" cy="-9" r="4.7"/><circle cx="17" cy="23.5" r="4.7"/><circle cx="-17" cy="23.5" r="4.7"/><circle cx="-27.6" cy="-9" r="4.7"/>
    </g>
  </g>
  <use href="#pad" transform="matrix(.94 -.20 0 1.08 493 168)"/>
