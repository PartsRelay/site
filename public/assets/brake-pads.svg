<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Disc brake assembly</title>
  <desc id="desc">An outer brake pad, ventilated disc and inner brake pad, separated along the axle to show how the two pads face the disc.</desc>
  <defs><style>@font-face{font-family:'Source Sans 3';src:url(data:font/woff;base64,) format('woff');font-style:normal;font-weight:400}</style>
    <path id="backing" d="M-60 3v-10h12c6-12 22-24 43-30 22-6 44-3 56 4l6 10h9v13h-9l-4 13-8 4C29 0 11 0-5 5c-16 5-28 13-37 23l-9-2-2-20Z"/>
    <path id="lining" d="M-45-7c10-9 24-19 43-24 18-5 36-4 48 2l5 14-7 11C25-10 10-8-9-2c-15 5-27 12-34 19l-5-10Z"/>
    <path id="slot" d="M-18-88q12-2 24-1" fill="none" stroke="#8ea9a1" stroke-width="3" stroke-linecap="round"/>
    <g id="pad" stroke="#254950" stroke-width="2.5" stroke-linejoin="round">
      <use href="#backing" transform="translate(8 3)" fill="#a3b9b0"/>
      <use href="#backing" fill="#d6e4d9"/>
      <use href="#lining" fill="#6e8c83"/>
      <path d="m-1-28 2 18" stroke="#d6e4d9" stroke-width="4"/>
    </g>
  </defs>
  <g fill="none" stroke="#849c94" stroke-width="1.5" stroke-dasharray="6 6">
    <path d="m60 138 502 44"/>
    <path d="m101 112 453 39"/>
  </g>
