version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check 0.9.12 only supports TypeScript 5 and 6.
      # Remove this once a release of @astrojs/check supports TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
